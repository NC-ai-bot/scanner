<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>隨手掃描</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="隨手掃描">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="jspdf.umd.min.js"></script>
<script src="hwmodel.js"></script>
<style>
  :root{ --accent:#0f766e; --accent-2:#14b8a6; --bg:#f3f4f6; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --danger:#dc2626; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top)}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  button:disabled{opacity:.35;cursor:default}
  .hidden{display:none!important}

  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
  header h1{font-size:20px;margin:0;letter-spacing:.5px}
  header .count{color:var(--muted);font-size:14px;flex:1}
  .eng{font-size:12px;color:var(--muted);background:#e5e7eb;border-radius:999px;padding:4px 10px}
  .eng.ok{background:#ccfbf1;color:#0f766e}
  .eng.bad{background:#fee2e2;color:#991b1b}
  main{padding:0 16px 150px;max-width:900px;margin:0 auto}

  .empty{background:var(--card);border-radius:16px;padding:28px 20px;text-align:center;margin-top:8px;border:1px dashed #cbd5e1}
  .empty .big{font-size:44px}
  .empty h2{font-size:17px;margin:8px 0 6px}
  .empty p{color:var(--muted);font-size:14px;line-height:1.7;margin:0}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:8px}
  .card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);position:relative}
  .card .thumb{display:block;width:100%;aspect-ratio:3/4;background:#e5e7eb;padding:0}
  .card .thumb img{width:100%;height:100%;object-fit:contain;display:block}
  .card .badge{position:absolute;left:6px;top:6px;background:#fbbf24;color:#422006;font-size:11px;font-weight:600;padding:3px 7px;border-radius:999px;pointer-events:none}
  .card.working .thumb::after{content:"處理中…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6);font-size:13px;color:var(--muted)}
  .cbar{display:flex;align-items:center;justify-content:space-between;padding:4px 6px;font-size:13px;color:var(--muted)}
  .cbar button{width:34px;height:30px;border-radius:8px;font-size:20px;line-height:1}
  .cbar button:active{background:var(--line)}

  .panel{background:var(--card);border-radius:14px;margin-top:16px;padding:6px 14px}
  .panel summary{padding:10px 0;font-weight:600;cursor:pointer;list-style:none}
  .panel summary::-webkit-details-marker{display:none}
  .panel summary::after{content:"▾";float:right;color:var(--muted)}
  .field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
  .field input,.field select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
  .field input{flex:1;max-width:60%}
  .linkbtn{color:var(--accent);font-size:14px;padding:6px 0}
  .dangerbtn{color:var(--danger);font-size:14px;padding:6px 0}
  .note{font-size:13px;color:var(--muted);line-height:1.6;margin:14px 2px}
  .warn{background:#fef3c7;color:#92400e;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}

  .dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .dock .inner{max-width:900px;margin:0 auto;display:flex;gap:10px}
  .dock button,.dock label{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:58px;border-radius:14px;font-size:13px;background:#f3f4f6;cursor:pointer}
  .dock .ico{font-size:22px;line-height:1}
  .dock .primary{background:var(--accent);color:#fff}
  .dock input{display:none}

  /* editor */
  .editor{position:fixed;inset:0;z-index:20;background:#0b0f14;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  .ebar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;flex:none}
  .ebar .t{font-weight:600}
  .txtbtn{padding:8px 12px;border-radius:10px;font-size:16px;color:#cbd5e1}
  .txtbtn.strong{color:#5eead4;font-weight:600}
  .stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0}
  .box{position:relative;flex:none}
  .box canvas{display:block;width:100%;height:100%}
  #overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none;overflow:visible}
  .loupe{position:absolute;top:12px;left:12px;width:120px;height:120px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.5);pointer-events:none;background:#000}
  .prev{display:block;box-shadow:0 4px 20px rgba(0,0,0,.5);background:#fff}
  .etools{flex:none;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;align-items:center}
  .etools .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .tbtn{background:#1f2937;color:#e5e7eb;padding:10px 16px;border-radius:12px;font-size:15px}
  .tbtn:active{background:#374151}
  .tbtn.danger{color:#fca5a5}
  .tbtn.sm{padding:6px 12px;font-size:14px}
  .hint{font-size:13px;color:#9ca3af}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{padding:9px 16px;border-radius:999px;background:#1f2937;color:#e5e7eb;font-size:15px}
  .chip.on{background:var(--accent-2);color:#042f2e;font-weight:600}
  .hwrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  .hwrow .lab{font-size:13px;color:#9ca3af;margin-right:2px}
  .chip.tog{padding:7px 13px;font-size:14px;background:#111827;border:1px solid #374151}
  .chip.tog.on{background:#fbbf24;color:#422006;border-color:#fbbf24}
  .chip.tog.ai{border-color:#a78bfa;color:#ddd6fe}
  .slrow{display:flex;align-items:center;gap:10px;font-size:14px;color:#d1d5db;flex-wrap:wrap;justify-content:center}
  .slrow input[type=range]{width:160px;accent-color:#fbbf24}
  #aiInfo{color:#fdba74}

  /* camera */
  .cam{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column}
  .cam .view{flex:1;position:relative;overflow:hidden;min-height:0;display:flex;align-items:center;justify-content:center}
  .cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  .cam #camOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .cam .top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(rgba(0,0,0,.55),transparent)}
  .cam .status{font-size:14px;color:#e5e7eb;background:rgba(0,0,0,.45);padding:6px 12px;border-radius:999px}
  .cam .bottom{flex:none;display:flex;align-items:center;justify-content:space-around;padding:14px 16px calc(18px + env(safe-area-inset-bottom));background:#000}
  .shutter{width:76px;height:76px;border-radius:50%;background:#fff;border:5px solid #9ca3af;box-shadow:0 0 0 3px #000 inset}
  .shutter:active{transform:scale(.94)}
  .camside{width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#d1d5db}
  .camside .ico{font-size:22px}
  .camside.on .ico{color:#5eead4}
  .lastshot{width:56px;height:56px;border-radius:10px;background:#1f2937;overflow:hidden;position:relative}
  .lastshot img{width:100%;height:100%;object-fit:cover;display:block}
  .lastshot .n{position:absolute;right:-4px;top:-4px;background:var(--accent-2);color:#042f2e;font-weight:700;font-size:12px;border-radius:999px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}

  .busy{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
  .busy .b{background:#fff;color:var(--ink);border-radius:14px;padding:18px 22px;display:flex;align-items:center;gap:12px;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .busy .cancel{margin-left:6px;color:var(--accent);font-size:14px;padding:4px 8px}
  .spin{width:22px;height:22px;border:3px solid #e5e7eb;border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .sheetbg{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  .sh-title{font-weight:700;font-size:17px;text-align:center}
  .sh-name{color:var(--muted);font-size:13px;text-align:center;word-break:break-all;margin-bottom:4px;line-height:1.6}
  .sh-btn{height:50px;border-radius:12px;background:#f3f4f6;font-size:16px}
  .sh-btn.primary{background:var(--accent);color:#fff;font-weight:600}
  .sh-btn.ghost{background:none;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:50;background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:88vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .25s}
</style>
</head>
<body>
<header><h1>隨手掃描</h1><span class="count" id="count"></span><span class="eng" id="eng">影像引擎載入中…</span></header>

<main>
  <div class="empty" id="empty">
    <div class="big">📄</div>
    <h2>拍下紙張，變成乾淨的 PDF</h2>
    <p>按下方「拍照」或「相簿」加入頁面。<br>自動找出紙張、拉正、去陰影，<br>還能去掉藍紅筆和鉛筆的手寫字，<br>匯出 PDF，沒有浮水印。</p>
  </div>

  <div class="grid" id="grid"></div>

  <div class="warn hidden" id="dlWarn">目前這個畫面不能下載檔案。請在 claude.ai 網頁或 Claude App 裡打開這個頁面再匯出。</div>

  <details class="panel" id="settings">
    <summary>設定</summary>
    <div class="field"><span>檔名</span><input id="fname" type="text"></div>
    <div class="field"><span>預設效果</span>
      <select id="defFilter">
        <option value="enhance">增強（推薦）</option>
        <option value="bw">黑白（考卷、講義）</option>
        <option value="gray">灰階</option>
        <option value="original">原圖</option>
      </select>
    </div>
    <div class="field"><span>預設去手寫</span>
      <select id="defHw">
        <option value="ai">AI 去手寫（含黑筆）＋藍／紅筆</option>
        <option value="color">只去藍／紅筆</option>
        <option value="both">藍／紅筆＋鉛筆</option>
        <option value="none">不去除</option>
      </select>
    </div>
    <div class="field"><span>自動連拍</span>
      <select id="autoShot">
        <option value="on">對準紙張自動拍</option>
        <option value="off">手動按快門</option>
      </select>
    </div>
    <div class="field"><span></span><button class="linkbtn" id="applyAll">用目前設定重新處理所有頁面</button></div>
    <div class="field"><span>PDF 頁面</span>
      <select id="pageSize">
        <option value="a4">A4（自動直橫）</option>
        <option value="fit">依照片比例</option>
      </select>
    </div>
    <div class="field"><span>畫質</span>
      <select id="quality">
        <option value="std">標準（檔案小）</option>
        <option value="high">高畫質</option>
      </select>
    </div>
    <div class="field"><span></span><button class="dangerbtn" id="clearAll">清除全部頁面</button></div>
  </details>

  <p class="note" id="note">掃描的頁面會存在這台裝置上，關掉再開還在。照片只在你的裝置上處理，不會上傳。</p>
</main>

<div class="dock">
  <div class="inner">
    <button id="camBtn"><span class="ico">📷</span>拍照</button>
    <label id="camLabel" class="hidden"><input type="file" id="camInput" accept="image/*" capture="environment"><span class="ico">📷</span>拍照</label>
    <label><input type="file" id="libInput" accept="image/*" multiple><span class="ico">🖼️</span>相簿</label>
    <button class="primary" id="exportBtn" disabled><span class="ico">⬇︎</span>匯出 PDF</button>
  </div>
</div>

<!-- live camera -->
<div class="cam hidden" id="cam">
  <div class="view">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="camOverlay"></canvas>
    <div class="flash" id="flash"></div>
    <div class="top"><button class="txtbtn" id="camClose">關閉</button><span class="status" id="camStatus">尋找紙張中…</span><button class="txtbtn strong" id="camDone">完成</button></div>
  </div>
  <div class="bottom">
    <button class="camside" id="camAuto"><span class="ico">◎</span><span>自動拍</span></button>
    <button class="shutter" id="shutter" aria-label="拍照"></button>
    <div class="camside"><div class="lastshot" id="lastshot"><span class="n hidden" id="shotN">0</span></div></div>
  </div>
</div>

<!-- editor -->
<div class="editor hidden" id="editor">
  <div class="ebar">
    <button class="txtbtn" id="eBack">返回</button>
    <div class="t" id="eTitle">調整邊框</div>
    <button class="txtbtn strong" id="eNext">下一步</button>
  </div>
  <div class="stage" id="stage">
    <div class="box" id="cropBox"><canvas id="cropCanvas"></canvas><svg id="overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg></div>
    <canvas class="prev hidden" id="prevCanvas"></canvas>
    <canvas class="loupe hidden" id="loupe" width="240" height="240"></canvas>
  </div>
  <div class="etools" id="cropTools">
    <div class="row"><button class="tbtn" id="tAuto">自動偵測</button><button class="tbtn" id="tFull">整張</button></div>
    <div class="hint">拖曳四個角，對齊紙張邊緣</div>
  </div>
  <div class="etools hidden" id="adjTools">
    <div class="chips" id="chips"></div>
    <div class="hwrow"><span class="lab">去手寫</span>
      <button class="chip tog" id="hwColor">藍／紅筆</button>
      <button class="chip tog" id="hwPencil">鉛筆</button>
      <button class="chip tog" id="hwModel">🤖 AI 去手寫</button>
      <button class="chip tog" id="hwErase">✎ 橡皮擦</button>
      <button class="chip tog ai hidden" id="hwAI">☁️ 問 Claude</button>
    </div>
    <div class="slrow hidden" id="pencilRow"><span>鉛筆去除強度</span><input type="range" id="pencilT" min="25" max="70" value="45"><span class="hint">太強會吃掉淡的印刷字</span></div>
    <div class="slrow hidden" id="eraseRow"><span>筆刷</span><input type="range" id="brush" min="4" max="40" value="12"><button class="tbtn sm" id="undoStroke">↶ 復原</button></div>
    <div class="slrow hidden" id="aiRow"><span id="aiInfo"></span><button class="tbtn sm" id="aiClear">全部還原</button></div>
    <div class="row">
      <button class="tbtn" id="tRot">↻ 旋轉</button>
      <button class="tbtn" id="tSaveImg">存成圖片</button>
      <button class="tbtn danger" id="tDel">刪除此頁</button>
    </div>
  </div>
</div>

<div class="busy hidden" id="busy"><div class="b"><div class="spin"></div><span id="busyText">處理中…</span><button class="cancel hidden" id="busyCancel">取消</button></div></div>
<div class="toast hidden" id="toast"></div>

<div class="sheetbg hidden" id="sheet">
  <div class="sheet">
    <div class="sh-title" id="shTitle">檔案準備好了</div>
    <div class="sh-name" id="shName"></div>
    <button class="sh-btn primary" id="shShare">分享／存到「檔案」</button>
    <button class="sh-btn" id="shDown">下載</button>
    <button class="sh-btn ghost" id="shClose">關閉</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const MAX_SRC = 3000;   // working copy of the photo
const OUT_MAX = 2400;   // stored scan resolution
const PREV_MAX = 1300;  // editor preview resolution
const FILTERS = [{id:'original',name:'原圖'},{id:'enhance',name:'增強'},{id:'gray',name:'灰階'},{id:'bw',name:'黑白'}];
const CLAUDE_URL = 'https://claude.ai/artifact/U91zTDhgKzjACF264YRVuK';
const APP_VER = 'v9';

const state = { pages: [], seq: 0 };
const inClaude = !!(window.claude && window.claude.use);
let downloadsApi;          // Claude: undefined = unknown, null = unavailable
let sampleApi = null;      // Claude: AI

/* ---------- small helpers ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(msg, ms = 2600){
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); t.style.opacity = 1;
  clearTimeout(toast._h); toast._h = setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.classList.add('hidden'), 260); }, ms);
}
async function busy(text){ $('#busyText').textContent = text; $('#busy').classList.remove('hidden'); await sleep(30); }
function done(){ $('#busy').classList.add('hidden'); $('#busyCancel').classList.add('hidden'); }
function freeCanvas(c){ if (c){ c.width = 0; c.height = 0; } }
function canvasToBlob(c, type = 'image/jpeg', q = 0.9){ return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode failed')), type, q)); }
function blobToImage(blob){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('無法讀取圖片')); };
    img.src = url;
  });
}
async function blobToCanvas(blob, maxSide = Infinity){
  const img = await blobToImage(blob);
  const w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const ctx = c.getContext('2d', { willReadFrequently: true }); ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, c.width, c.height); return c;
}
const getData = c => c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, c.width, c.height);
function imgToCanvas(img){ // plain {data,width,height} or ImageData → canvas
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const id = img instanceof ImageData ? img : new ImageData(img.data, img.width, img.height);
  c.getContext('2d').putImageData(id, 0, 0); return c;
}
function cloneImg(img){ return { data: new Uint8ClampedArray(img.data), width: img.width, height: img.height }; }
function defaultName(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `掃描_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}
function defaultHw(){ const v = $('#defHw').value; return { color: v !== 'none', pencil: v === 'both', pencilT: 0.45, model: v === 'ai' }; }
function safeName(){ const n = ($('#fname').value || '').trim().replace(/[\\/:*?"<>|]+/g, '_'); return n || defaultName(); }
function fullQuad(W, H, inset = 0){ const ix = W * inset, iy = H * inset; return [{x:ix,y:iy},{x:W-ix,y:iy},{x:W-ix,y:H-iy},{x:ix,y:H-iy}]; }
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function isConvex(q){
  let sign = 0;
  for (let i = 0; i < 4; i++){
    const a = q[i], b = q[(i+1)%4], c = q[(i+2)%4], cr = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x);
    if (Math.abs(cr) < 1e-6) return false; const s = Math.sign(cr); if (!sign) sign = s; else if (s !== sign) return false;
  }
  return true;
}

/* ---------- image engine (OpenCV in a worker, main-thread fallback) ---------- */
const CV = (() => {
  let worker = null, seq = 0, pending = new Map(), ready = null, mode = 'none';
  function setEng(txt, cls){ const e = $('#eng'); e.textContent = txt; e.className = 'eng ' + (cls || ''); }
  function call(op, img, extra = {}){
    if (mode === 'worker'){
      return new Promise((res, rej) => {
        const id = ++seq; pending.set(id, { res, rej });
        const plain = img ? { data: img.data, width: img.width, height: img.height } : null;
        const transfer = plain && plain.data.buffer ? [plain.data.buffer] : [];
        worker.postMessage({ id, op, img: plain, ...extra }, transfer);
      });
    }
    return new Promise((res, rej) => { try {
      if (op === 'detect') res(CVPipe.detect(img));
      else if (op === 'warp') res(CVPipe.warp(img, extra.quad, extra.maxSide));
      else if (op === 'process') res(CVPipe.process(img, extra.opts));
      else if (op === 'scan'){ const w = CVPipe.warp(img, extra.quad, extra.maxSide); res({ warped: w, out: CVPipe.process(w, extra.opts) }); }
      else rej(new Error('unknown op'));
    } catch (e){ rej(e); } });
  }
  function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); }); }
  async function initMain(){
    await loadScript('opencv.js'); await loadScript('cvpipe.js');
    let m = window.cv; if (m && typeof m.then === 'function') m = await m; else if (m && m.ready) m = await m.ready;
    if (!m || !m.Mat) throw new Error('opencv');
    CVPipe.use(m); mode = 'main';
  }
  function initWorker(){
    return new Promise((res, rej) => {
      let w;
      try { w = new Worker('cvworker.js'); } catch (e){ rej(e); return; }
      const timer = setTimeout(() => { try { w.terminate(); } catch (e) {} rej(new Error('worker timeout')); }, 90000);
      w.onerror = e => { clearTimeout(timer); rej(new Error(e.message || 'worker error')); };
      w.onmessage = e => {
        const { id, ok, res: r, err } = e.data;
        if (id === 0){ clearTimeout(timer); if (ok){ worker = w; mode = 'worker'; w.onerror = ev => console.error(ev); res(); } else rej(new Error(err)); return; }
        const p = pending.get(id); if (!p) return; pending.delete(id);
        ok ? p.res(r) : p.rej(new Error(err));
      };
      w.postMessage({ id: 0, op: 'ping' });
    });
  }
  function init(){
    if (ready) return ready;
    ready = (async () => {
      setEng('影像引擎載入中…');
      try { await initWorker(); }
      catch (e){ console.warn('worker failed, falling back', e); try { await initMain(); } catch (e2){ setEng('影像引擎載入失敗', 'bad'); throw e2; } }
      setEng('引擎就緒 ' + APP_VER, 'ok'); setTimeout(() => setEng(APP_VER, ''), 2500);
    })();
    return ready;
  }
  return {
    init,
    detect: async img => { await init(); return call('detect', img); },
    warp: async (img, quad, maxSide) => { await init(); return call('warp', img, { quad, maxSide }); },
    process: async (img, opts) => { await init(); return call('process', img, { opts }); },
    scan: async (img, quad, maxSide, opts) => { await init(); return call('scan', img, { quad, maxSide, opts }); },
  };
})();

/* ---------- keep pages on this device (IndexedDB) ---------- */
const store = { db: null, ok: false, timer: null };
function idbReq(r){ return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function storeOpen(){
  try {
    if (!window.indexedDB) return;
    const r = indexedDB.open('scanner', 1);
    r.onupgradeneeded = () => { const db = r.result; db.createObjectStore('pages', { keyPath: 'id' }); db.createObjectStore('meta'); };
    store.db = await idbReq(r); store.ok = true;
  } catch (e){ store.ok = false; }
}
const PAGE_KEYS = ['id','srcW','srcH','outW','outH','quad','filter','rot','hw','strokes','aiBoxes','srcBlob','outBlob','thumbBlob','uncertain'];
function persistSoon(){ if (!store.ok) return; clearTimeout(store.timer); store.timer = setTimeout(persistNow, 400); }
async function persistNow(){
  if (!store.ok) return;
  try {
    const tx = store.db.transaction(['pages', 'meta'], 'readwrite'), ps = tx.objectStore('pages');
    const keep = new Set(state.pages.map(p => p.id));
    for (const p of state.pages){
      if (!p._dirty || !p.outBlob) continue;
      const rec = {}; for (const k of PAGE_KEYS) rec[k] = p[k]; ps.put(rec); p._dirty = false;
    }
    const keys = await idbReq(ps.getAllKeys());
    for (const k of keys) if (!keep.has(k)) ps.delete(k);
    tx.objectStore('meta').put(state.pages.map(p => p.id), 'order');
    await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
  } catch (e){ console.error(e); toast('手機空間不足，頁面可能沒有存起來，請先匯出'); }
}
async function restore(){
  if (!store.ok) return;
  try {
    const tx = store.db.transaction(['pages', 'meta'], 'readonly');
    const order = (await idbReq(tx.objectStore('meta').get('order'))) || [];
    const recs = await idbReq(tx.objectStore('pages').getAll());
    const byId = new Map(recs.map(r => [r.id, r]));
    for (const id of order){
      const r = byId.get(id); if (!r || !r.srcBlob || !r.outBlob) continue;
      const p = { ...r, strokes: r.strokes || [], aiBoxes: r.aiBoxes || [], hw: r.hw || { color: false, pencil: false, pencilT: 0.45, model: false } };
      p.thumbUrl = URL.createObjectURL(r.thumbBlob || r.outBlob);
      state.pages.push(p); state.seq = Math.max(state.seq, p.id);
    }
  } catch (e){ console.error(e); }
}

/* ---------- drawing extras on the finished scan ---------- */
function drawStrokes(ctx, strokes, W, H){
  if (!strokes || !strokes.length) return;
  const M = Math.max(W, H);
  ctx.save(); ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const s of strokes){
    ctx.lineWidth = s.r * 2 * M; const p = s.pts;
    if (p.length === 1){ ctx.beginPath(); ctx.arc(p[0].x * W, p[0].y * H, s.r * M, 0, Math.PI * 2); ctx.fill(); continue; }
    ctx.beginPath(); p.forEach((q, i) => i ? ctx.lineTo(q.x * W, q.y * H) : ctx.moveTo(q.x * W, q.y * H)); ctx.stroke();
  }
  ctx.restore();
}
function drawBoxes(ctx, boxes, W, H, show){
  if (!boxes || !boxes.length) return;
  ctx.save(); ctx.fillStyle = '#fff';
  for (const b of boxes) ctx.fillRect(b.x0 * W, b.y0 * H, (b.x1 - b.x0) * W, (b.y1 - b.y0) * H);
  if (show){
    const lw = Math.max(2, Math.max(W, H) / 400);
    ctx.strokeStyle = '#f97316'; ctx.lineWidth = lw; ctx.setLineDash([lw * 3, lw * 2]); ctx.fillStyle = 'rgba(249,115,22,.10)';
    for (const b of boxes){ const r = [b.x0 * W, b.y0 * H, (b.x1 - b.x0) * W, (b.y1 - b.y0) * H]; ctx.fillRect(...r); ctx.strokeRect(...r); }
  }
  ctx.restore();
}
function finishCanvas(img, opts){ // processed image → rotated canvas with eraser strokes and AI boxes
  const c = imgToCanvas(img), cx = c.getContext('2d');
  if (opts.modelMask){ cx.save(); cx.globalCompositeOperation = 'source-over'; cx.drawImage(opts.modelMask, 0, 0, c.width, c.height); cx.restore(); }
  drawStrokes(cx, opts.strokes, c.width, c.height);
  drawBoxes(cx, opts.aiBoxes, c.width, c.height, opts.showBoxes);
  const rot = opts.rot || 0; if (!rot) return c;
  const r = document.createElement('canvas'), sw = rot % 2 === 1;
  r.width = sw ? c.height : c.width; r.height = sw ? c.width : c.height;
  const x = r.getContext('2d'); x.translate(r.width/2, r.height/2); x.rotate(rot * Math.PI / 2); x.drawImage(c, -c.width/2, -c.height/2);
  freeCanvas(c); return r;
}

/* ---------- pages ---------- */
async function storeResult(page, canvas){
  page.outW = canvas.width; page.outH = canvas.height;
  page.outBlob = await canvasToBlob(canvas, 'image/jpeg', 0.9);
  const t = document.createElement('canvas'), k = 320 / Math.max(canvas.width, canvas.height);
  t.width = Math.max(1, Math.round(canvas.width * k)); t.height = Math.max(1, Math.round(canvas.height * k));
  const tx = t.getContext('2d'); tx.imageSmoothingQuality = 'high'; tx.drawImage(canvas, 0, 0, t.width, t.height);
  const tb = await canvasToBlob(t, 'image/jpeg', 0.8);
  if (page.thumbUrl) URL.revokeObjectURL(page.thumbUrl);
  page.thumbUrl = URL.createObjectURL(tb); page.thumbBlob = tb; page._dirty = true;
  freeCanvas(canvas); freeCanvas(t);
}
// full pipeline from the stored source photo (used after edits and for "re-process all")
async function reprocess(page, srcImg){
  if (!srcImg){ const c = await blobToCanvas(page.srcBlob); srcImg = getData(c); freeCanvas(c); }
  const r = await CV.scan(srcImg, page.quad, OUT_MAX, { filter: page.filter, hw: page.hw });
  let modelMask = null;
  if (page.hw && page.hw.model){
    try { const mr = await HWModel.handwritingMask(r.warped, t => { if (!camOpen()) $('#busyText').textContent = t; }, r.out); modelMask = mr.canvas; }
    catch (e){ console.error(e); toast('AI 模型無法載入，這一頁先不去手寫'); }
  }
  await storeResult(page, finishCanvas(r.out, { ...page, modelMask }));
  if (modelMask) modelMask.width = 0;
}
let addQueue = Promise.resolve(), queued = 0;
function addFiles(files){
  const list = Array.from(files || []).filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|heic|heif|webp)$/i.test(f.name || ''));
  if (!list.length) return Promise.resolve();
  queued += list.length;
  const run = addQueue.then(async () => {
    let failed = 0, added = 0;
    for (const f of list){
      const n = state.pages.length + 1;
      if (!camOpen()) await busy(queued > 1 ? `處理第 ${n} 頁…（還有 ${queued - 1} 張）` : '處理中…');
      try {
        const src = await blobToCanvas(f, MAX_SRC);
        const page = { id: ++state.seq, srcW: src.width, srcH: src.height, filter: $('#defFilter').value, rot: 0, hw: defaultHw(), strokes: [], aiBoxes: [] };
        page.srcBlob = await canvasToBlob(src, 'image/jpeg', 0.92);
        const det = await CV.detect(getData(src)); // detect transfers its buffer, so read again for scan
        page.quad = det ? det.quad : fullQuad(src.width, src.height, 0.02);
        page.detScore = det ? det.score : 0; page.uncertain = !det || !det.certain;
        await reprocess(page, getData(src)); freeCanvas(src);
        state.pages.push(page); added++; render();
      } catch (e){ failed++; console.error(e); }
      queued--;
    }
    if (!camOpen()) done();
    if (failed) toast(`有 ${failed} 張照片處理失敗` + (failed === list.length ? '，可能是格式不支援' : ''));
    else if (added === 1 && !camOpen() && state.pages[state.pages.length - 1].uncertain){
      // not sure about the paper outline: let the person check the corners right away
      toast('不太確定紙張邊緣在哪，請確認四個角', 3500); openEditor(state.pages[state.pages.length - 1]);
    }
    else if (added && !camOpen()){
      const unsure = state.pages.slice(-added).filter(p => p.uncertain).length;
      toast(unsure ? `已加入 ${added} 頁，有 ${unsure} 頁的邊框不太確定（縮圖上有 ⚠），點進去確認` : (added > 1 ? `已加入 ${added} 頁，點縮圖可以調整` : '已加入 1 頁，點縮圖可以調整'), 4000);
    }
    return added;
  });
  addQueue = run.catch(() => {});
  return run;
}
function render(){
  const n = state.pages.length, g = $('#grid');
  $('#empty').classList.toggle('hidden', n > 0);
  $('#count').textContent = n ? `${n} 頁` : '';
  $('#exportBtn').disabled = !n;
  g.innerHTML = '';
  state.pages.forEach((p, i) => {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<button class="thumb" data-act="edit"><img alt="第 ${i+1} 頁" src="${p.thumbUrl}">${p.uncertain ? '<span class="badge">⚠ 確認邊框</span>' : ''}</button>
      <div class="cbar"><button data-act="left" ${i === 0 ? 'disabled' : ''} aria-label="往前">‹</button><span>第 ${i+1} 頁</span><button data-act="right" ${i === n-1 ? 'disabled' : ''} aria-label="往後">›</button></div>`;
    card.addEventListener('click', e => {
      const btn = e.target.closest('[data-act]'); if (!btn || btn.disabled) return;
      const act = btn.dataset.act, idx = state.pages.indexOf(p);
      if (act === 'edit') openEditor(p);
      else if (act === 'left' && idx > 0){ [state.pages[idx-1], state.pages[idx]] = [state.pages[idx], state.pages[idx-1]]; render(); }
      else if (act === 'right' && idx < n-1){ [state.pages[idx+1], state.pages[idx]] = [state.pages[idx], state.pages[idx+1]]; render(); }
    });
    g.appendChild(card);
  });
  persistSoon();
}

/* ---------- live camera ---------- */
const cam = { stream: null, track: null, loop: null, busy: false, last: null, stable: 0, shots: 0, auto: true, cooldown: 0, armed: true, shotQuad: null };
const camOpen = () => !cam.stream ? false : true;
const hasCamera = !inClaude && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
async function openCamera(){
  if (!hasCamera){ $('#camInput').click(); return; }
  try {
    cam.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 4096 }, height: { ideal: 3072 } } });
  } catch (e){
    console.warn(e); toast('無法開啟相機，改用系統相機'); $('#camInput').click(); return;
  }
  cam.track = cam.stream.getVideoTracks()[0];
  const v = $('#video'); v.srcObject = cam.stream; try { await v.play(); } catch (e) {}
  cam.auto = $('#autoShot').value === 'on'; $('#camAuto').classList.toggle('on', cam.auto);
  cam.shots = 0; cam.last = null; cam.stable = 0; cam.armed = true; cam.shotQuad = null; $('#shotN').classList.add('hidden'); $('#lastshot').innerHTML = '<span class="n hidden" id="shotN">0</span>';
  $('#cam').classList.remove('hidden'); $('#camStatus').textContent = '尋找紙張中…';
  CV.init().catch(() => {});
  cam.loop = setInterval(camTick, 220);
}
function closeCamera(){
  clearInterval(cam.loop); cam.loop = null;
  if (cam.stream){ cam.stream.getTracks().forEach(t => t.stop()); cam.stream = null; cam.track = null; }
  $('#video').srcObject = null; $('#cam').classList.add('hidden');
  const ov = $('#camOverlay'); ov.getContext('2d').clearRect(0, 0, ov.width, ov.height);
  render();
}
const camWork = document.createElement('canvas');
async function camTick(){
  if (cam.busy || !cam.stream) return;
  const v = $('#video'); if (!v.videoWidth) return;
  cam.busy = true;
  try {
    const k = 360 / Math.max(v.videoWidth, v.videoHeight), w = Math.round(v.videoWidth * k), h = Math.round(v.videoHeight * k);
    camWork.width = w; camWork.height = h;
    const cx = camWork.getContext('2d', { willReadFrequently: true }); cx.drawImage(v, 0, 0, w, h);
    const det = await CV.detect(cx.getImageData(0, 0, w, h));
    if (!cam.stream) return;
    const q = det && det.score > 0.08 ? det.quad.map(p => ({ x: p.x / k, y: p.y / k })) : null;
    drawCamQuad(q);
    if (q && cam.last){
      const move = Math.max(...q.map((p, i) => dist(p, cam.last[i]))) / Math.max(v.videoWidth, v.videoHeight);
      cam.stable = move < 0.012 ? cam.stable + 1 : 0;
    } else cam.stable = 0;
    cam.last = q;
    const now = Date.now();
    // after an automatic shot, wait until the paper leaves or clearly moves before arming again (no duplicate shots of one page)
    if (!cam.armed){
      const moved = !q || !cam.shotQuad || Math.max(...q.map((p, i) => dist(p, cam.shotQuad[i]))) / Math.max(v.videoWidth, v.videoHeight) > 0.08;
      if (moved && now >= cam.cooldown) cam.armed = true;
    }
    if (!q) $('#camStatus').textContent = '尋找紙張中…';
    else if (cam.auto){
      if (!cam.armed) $('#camStatus').textContent = '已拍，換下一張';
      else if (cam.stable >= 4){ $('#camStatus').textContent = '拍攝！'; cam.shotQuad = q; cam.armed = false; cam.cooldown = now + 1200; await captureFrame(); cam.stable = 0; }
      else $('#camStatus').textContent = '請拿穩…';
    } else $('#camStatus').textContent = '已對準，按快門';
  } catch (e){ console.error(e); }
  finally { cam.busy = false; }
}
function drawCamQuad(q){
  const v = $('#video'), ov = $('#camOverlay'), r = ov.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (ov.width !== Math.round(r.width * dpr) || ov.height !== Math.round(r.height * dpr)){ ov.width = Math.round(r.width * dpr); ov.height = Math.round(r.height * dpr); }
  const ctx = ov.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, r.width, r.height);
  if (!q) return;
  // video is object-fit: contain → compute displayed rect
  const s = Math.min(r.width / v.videoWidth, r.height / v.videoHeight), dw = v.videoWidth * s, dh = v.videoHeight * s, ox = (r.width - dw) / 2, oy = (r.height - dh) / 2;
  ctx.beginPath(); q.forEach((p, i) => i ? ctx.lineTo(ox + p.x * s, oy + p.y * s) : ctx.moveTo(ox + p.x * s, oy + p.y * s)); ctx.closePath();
  ctx.fillStyle = cam.stable >= 4 ? 'rgba(45,212,191,.28)' : 'rgba(45,212,191,.14)'; ctx.fill();
  ctx.strokeStyle = '#2dd4bf'; ctx.lineWidth = 3; ctx.stroke();
  for (const p of q){ ctx.beginPath(); ctx.arc(ox + p.x * s, oy + p.y * s, 7, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); }
}
async function captureFrame(){
  const v = $('#video'); if (!v.videoWidth) return;
  const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  const fl = $('#flash'); fl.style.opacity = .85; setTimeout(() => fl.style.opacity = 0, 120);
  if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) {}
  const blob = await canvasToBlob(c, 'image/jpeg', 0.93); freeCanvas(c);
  cam.shots++;
  const ls = $('#lastshot'); const url = URL.createObjectURL(blob);
  ls.innerHTML = `<img src="${url}" alt=""><span class="n" id="shotN">${cam.shots}</span>`;
  addFiles([new File([blob], `cam_${Date.now()}.jpg`, { type: 'image/jpeg' })]).then(() => { if (cam.stream) $('#camStatus').textContent = `已存第 ${state.pages.length} 頁，繼續拍下一張`; });
}
$('#camBtn').addEventListener('click', openCamera);
$('#shutter').addEventListener('click', () => { captureFrame(); cam.shotQuad = cam.last; cam.armed = false; cam.cooldown = Date.now() + 1200; });
$('#camAuto').addEventListener('click', () => { cam.auto = !cam.auto; $('#camAuto').classList.toggle('on', cam.auto); $('#autoShot').value = cam.auto ? 'on' : 'off'; toast(cam.auto ? '對準紙張、拿穩就會自動拍' : '改為手動按快門'); });
$('#camClose').addEventListener('click', closeCamera);
$('#camDone').addEventListener('click', closeCamera);
if (!hasCamera){ $('#camBtn').classList.add('hidden'); $('#camLabel').classList.remove('hidden'); }

/* ---------- editor ---------- */
const ed = { page: null, src: null, srcData: null, draft: null, step: 'crop', scale: 1, drag: null, prevBase: null, eraser: false, busy: false };
async function openEditor(page){
  await busy('開啟中…');
  try { ed.src = await blobToCanvas(page.srcBlob); }
  catch (e){ done(); toast('無法開啟這一頁'); return; }
  ed.page = page; ed.srcData = null; ed.prevBase = null; ed.eraser = false; ed.maskCache = null;
  ed.draft = { quad: page.quad.map(p => ({...p})), filter: page.filter, rot: page.rot, hw: { ...page.hw }, strokes: page.strokes.map(s => ({ r: s.r, pts: s.pts.slice() })), aiBoxes: (page.aiBoxes || []).map(b => ({ ...b })) };
  $('#editor').classList.remove('hidden');
  done(); setStep('crop');
}
function closeEditor(){
  $('#editor').classList.add('hidden');
  freeCanvas(ed.src); ed.src = null; ed.srcData = null; ed.prevBase = null; ed.page = null;
  freeCanvas($('#cropCanvas')); freeCanvas($('#prevCanvas'));
  resetDel();
}
function setStep(step){
  ed.step = step;
  const crop = step === 'crop';
  $('#cropBox').classList.toggle('hidden', !crop); $('#cropTools').classList.toggle('hidden', !crop);
  $('#prevCanvas').classList.toggle('hidden', crop); $('#adjTools').classList.toggle('hidden', crop);
  $('#eTitle').textContent = crop ? '調整邊框' : '調整效果';
  $('#eBack').textContent = crop ? '返回' : '上一步';
  $('#eNext').textContent = crop ? '下一步' : '完成';
  requestAnimationFrame(() => crop ? layoutCrop() : renderPreview());
}
function stageSize(){ const r = $('#stage').getBoundingClientRect(); return { w: Math.max(50, r.width - 32), h: Math.max(50, r.height - 32) }; }
function layoutCrop(){
  if (!ed.src) return;
  const { w, h } = stageSize(), W = ed.src.width, H = ed.src.height;
  const s = Math.min(w / W, h / H); ed.scale = s;
  const cw = Math.round(W * s), ch = Math.round(H * s), dpr = Math.min(2, window.devicePixelRatio || 1);
  const box = $('#cropBox'); box.style.width = cw + 'px'; box.style.height = ch + 'px';
  const cv = $('#cropCanvas'); cv.width = Math.min(W, Math.round(cw * dpr)); cv.height = Math.min(H, Math.round(ch * dpr));
  const ctx = cv.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(ed.src, 0, 0, cv.width, cv.height);
  $('#overlay').setAttribute('viewBox', `0 0 ${W} ${H}`);
  drawOverlay();
}
function drawOverlay(){
  const W = ed.src.width, H = ed.src.height, s = ed.scale, q = ed.draft.quad;
  const pts = q.map(p => `${p.x},${p.y}`).join(' ');
  const sw = 2.5 / s, r = 11 / s;
  let html = `<path fill="rgba(0,0,0,.5)" fill-rule="evenodd" d="M0 0H${W}V${H}H0Z M${q.map(p => `${p.x} ${p.y}`).join(' L')}Z"/>`;
  html += `<polygon points="${pts}" fill="rgba(20,184,166,.12)" stroke="#2dd4bf" stroke-width="${sw}"/>`;

/* ---------- AI 去手寫 (Claude only) ---------- */
const AI_PROMPT = `這張圖是一頁考卷或講義的掃描。我在圖上加了淺藍色的格線和 0–1000 的座標數字，只是用來讓你標位置，不屬於紙本內容。

請找出頁面上「所有手寫的內容」：學生作答（選項字母、數字、文字）、計算過程、草稿、圈選、劃線、打勾打叉、塗改、批改分數、簽名，不論是黑筆、藍筆、紅筆或鉛筆。
不要包含任何印刷的東西：題目文字、題號、印刷的選項、表格線、印刷的答案格、圖表、頁首頁尾。

每一處手寫給一個矩形框，座標用 0–1000（左上角是 0,0，x 往右、y 往下）。框要緊貼筆跡、但要把整個筆跡完整包住；距離很近的手寫可以合併成一個框。如果手寫和印刷字重疊，框只框手寫的部分，盡量不要蓋到印刷字。

只回傳 JSON 陣列，例如：[{"x0":120,"y0":340,"x1":180,"y1":372}]。沒有手寫就回傳 []。`;
let aiCtl = null;
function gridOverlay(src){
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0);
  const W = c.width, H = c.height, fs = Math.max(12, Math.round(Math.max(W, H) / 70));
  x.strokeStyle = 'rgba(56,152,255,.45)'; x.lineWidth = Math.max(1, Math.max(W, H) / 1200);
  x.fillStyle = 'rgba(37,99,235,.9)'; x.font = `${fs}px sans-serif`; x.textBaseline = 'top';
  for (let k = 1; k < 10; k++){
    const gx = W * k / 10, gy = H * k / 10;
    x.beginPath(); x.moveTo(gx, 0); x.lineTo(gx, H); x.moveTo(0, gy); x.lineTo(W, gy); x.stroke();
    x.fillText(String(k * 100), gx + 3, 2); x.fillText(String(k * 100), 3, gy + 2);
  }
  return c;
}

  $('#shTitle').textContent = 'AI 去手寫';

  $('#shShare').classList.add('hidden'); $('#shDown').textContent = '打開 Claude 版';
  sheetFile = null; sheetMode = 'ai'; $('#sheet').classList.remove('hidden');
}
$('#hwAI').addEventListener('click', async () => {
  if (!sampleApi){ if (!inClaude) openAiInfo(); else toast('這個畫面不能使用 AI'); return; }
  if (!ed.prevBase) return;
  const view = finishCanvas(await CV.process(cloneImg(ed.prevBase), { filter: ed.draft.filter, hw: ed.draft.hw }), { ...ed.draft, aiBoxes: [], showBoxes: false });
  const k = Math.min(1, 1600 / Math.max(view.width, view.height));
  const small = document.createElement('canvas'); small.width = Math.round(view.width * k); small.height = Math.round(view.height * k);
  small.getContext('2d').drawImage(view, 0, 0, small.width, small.height); freeCanvas(view);
  const annotated = gridOverlay(small); freeCanvas(small);
  const blob = await canvasToBlob(annotated, 'image/jpeg', 0.9); freeCanvas(annotated);
  aiCtl = new AbortController();
  await busy('AI 正在找手寫…（約 10–60 秒）'); $('#busyCancel').classList.remove('hidden');
  try {
    const res = await sampleApi.json(AI_PROMPT, { images: [blob], signal: aiCtl.signal, cache: false });
    const arr = Array.isArray(res) ? res : (res && Array.isArray(res.boxes) ? res.boxes : []);
    const boxes = [];
    for (const r of arr){
      let x0 = Number(r.x0), y0 = Number(r.y0), x1 = Number(r.x1), y1 = Number(r.y1);
      if (![x0, y0, x1, y1].every(Number.isFinite)) continue;
      if (x1 < x0) [x0, x1] = [x1, x0]; if (y1 < y0) [y0, y1] = [y1, y0];
      const pad = 4;
      x0 = Math.max(0, x0 - pad) / 1000; y0 = Math.max(0, y0 - pad) / 1000; x1 = Math.min(1000, x1 + pad) / 1000; y1 = Math.min(1000, y1 + pad) / 1000;

  } catch (e){
    done();
    const c = e && e.code;
    if (c === 'cancelled') return;

    else if (c === 'images_unavailable') toast('這個畫面不能傳圖片給 AI');
    else toast('AI 暫時無法使用，請稍後再試');
  }
});

async function pageJpegBytes(p, quality){
  if (quality === 'high') return new Uint8Array(await p.outBlob.arrayBuffer());
  const c = await blobToCanvas(p.outBlob, 2000);
  const b = await canvasToBlob(c, 'image/jpeg', 0.85); freeCanvas(c);

      else { pw = 210; ph = 210 * p.outH / p.outW; if (land){ ph = 210; pw = 210 * p.outW / p.outH; } }
      const k = Math.min(pw / p.outW, ph / p.outH), iw = p.outW * k, ih = p.outH * k;

      else doc.addPage([pw, ph], orient);
      const bytes = await pageJpegBytes(p, quality);
      doc.addImage(bytes, 'JPEG', (pw - iw) / 2, (ph - ih) / 2, iw, ih, undefined, 'FAST');

for (const id of ['defFilter', 'defHw', 'autoShot', 'pageSize', 'quality']) $('#' + id).addEventListener('change', () => {
  try { const o = {}; for (const k of ['defFilter', 'defHw', 'autoShot', 'pageSize', 'quality']) o[k] = $('#' + k).value; localStorage.setItem('scan-settings', JSON.stringify(o)); } catch (e) {}
});
$('#camInput').addEventListener('change', e => { const f = e.target.files; addFiles(f).finally(() => { e.target.value = ''; }); });
$('#libInput').addEventListener('change', e => { const f = e.target.files; addFiles(f).finally(() => { e.target.value = ''; }); });
$('#applyAll').addEventListener('click', async () => {
  const f = $('#defFilter').value; if (!state.pages.length){ toast('還沒有頁面'); return; }
  for (let i = 0; i < state.pages.length; i++){
    await busy(`重新處理… ${i+1} / ${state.pages.length}`);
    const p = state.pages[i]; p.filter = f; p.hw = defaultHw();
    try { await reprocess(p); } catch (e){ console.error(e); }
  }
  done(); render(); toast('已重新處理所有頁面');
});
let clearArmed = null;
$('#clearAll').addEventListener('click', () => {
  const b = $('#clearAll');
  if (!clearArmed){ b.textContent = '再按一次確認清除'; clearArmed = setTimeout(() => { clearArmed = null; b.textContent = '清除全部頁面'; }, 3000); return; }
  clearTimeout(clearArmed); clearArmed = null; b.textContent = '清除全部頁面';
  state.pages.forEach(p => p.thumbUrl && URL.revokeObjectURL(p.thumbUrl)); state.pages = []; render(); toast('已清除');
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

/* ---------- start-up ---------- */
(async () => {
  await storeOpen(); await restore(); render();
  if (!store.ok) $('#note').textContent = '這個瀏覽器不能保存頁面，重新整理或關閉就會清空，記得先匯出。照片只在你的裝置上處理，不會上傳。';
  if (!inClaude && 'serviceWorker' in navigator && location.protocol === 'https:'){
    const hadController = !!navigator.serviceWorker.controller; let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloading){ reloading = true; toast('已更新到新版，重新載入…'); setTimeout(() => location.reload(), 600); } });
    navigator.serviceWorker.register('sw.js').then(reg => { reg.update().catch(() => {}); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); }); }).catch(() => {});
  }
  CV.init().catch(e => console.error(e));
})();
(async () => {
  if (!inClaude) return;
  try { downloadsApi = await window.claude.use('downloads'); } catch (e){ downloadsApi = null; }
  if (!downloadsApi) $('#dlWarn').classList.remove('hidden');
  try {
    const s = await window.claude.use('sample');
    const lim = s ? await s.limits().catch(() => null) : null;
    sampleApi = (s && lim && lim.images) ? s : null;
  } catch (e){ sampleApi = null; }
  if (ed.page && ed.step === 'adjust') syncAdjUI();
})();
window.__scanner = { state, ed, CV, cam, reprocess, render };
})();
</script>
</body>
</html>
